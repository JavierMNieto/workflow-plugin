# The plugin's checks, and its release: on `test`, green, `main` moves to the
# commit, and every machine installing from `main` picks it up after its next
# session starts. A red run holds `main` where it was. Nothing else writes
# `main`, so the push is a fast-forward or it fails, which is right.
name: Checks

on:
  push:
    branches: [test]
  pull_request:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run validate
      - name: Move main to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        run: git push origin HEAD:main
